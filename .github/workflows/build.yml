    - name: Install Lilu Dependency
      run: |
        mkdir -p LiluDependencies
        cd LiluDependencies
        echo "Fetching real download URL from GitHub API..."
        
        # GitHub API üzerinden en son RELEASE.zip dosyasının URL'ini güvenli bir şekilde çekiyoruz
        LILU_URL=$(curl -s https://github.com | grep "browser_download_url" | grep -i "RELEASE.zip" | head -n 1 | cut -d '"' -f 4)
        
        echo "Downloading from: $LILU_URL"
        curl -L -H "User-Agent: Awesome-Octocat-App" -o Lilu.zip "$LILU_URL"
        
        echo "Unzipping Lilu..."
        unzip -q Lilu.zip -d Lilu
        
        # Framework arama yolları için kext'i proje kök dizinine taşıyoruz
        mv Lilu/Lilu.kext ../
        cd ..
