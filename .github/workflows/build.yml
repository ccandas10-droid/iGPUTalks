    - name: Install Lilu Dependency
      run: |
        mkdir -p LiluDependencies
        cd LiluDependencies
        echo "Fetching real download URL from GitHub API using jq..."
        
        # JQ kullanarak RELEASE.zip dosyasının URL'ini hatasız ve tırnaksız olarak çekiyoruz
        LILU_URL=$(curl -s https://github.com | jq -r '.assets[] | select(.name | contains("RELEASE.zip")) | .browser_download_url')
        
        if [ -z "$LILU_URL" ] || [ "$LILU_URL" = "null" ]; then
          echo "Error: Could not parse Lilu download URL."
          exit 1
        fi
        
        echo "Downloading from: $LILU_URL"
        curl -L -o Lilu.zip "$LILU_URL"
        
        echo "Unzipping Lilu..."
        unzip -q Lilu.zip -d Lilu
        mv Lilu/Lilu.kext ../
        cd ..
