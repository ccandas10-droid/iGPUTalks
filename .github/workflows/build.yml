name: CI Build Process

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build iGPUTalks Kext
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Get MacKernelSDK
      run: git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git

    - name: Set version
      run: |
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 29.41.10" iGPUTalks/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 29.41.10" iGPUTalks/Info.plist

    - name: Build Debug
      run: |
        xcodebuild -project iGPUTalks.xcodeproj -target iGPUTalks \
                   -configuration Debug \
                   CONFIGURATION_BUILD_DIR="$PWD/build/Debug" \
                   ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO

    - name: Build Release
      run: |
        xcodebuild -project iGPUTalks.xcodeproj -target iGPUTalks \
                   -configuration Release \
                   CONFIGURATION_BUILD_DIR="$PWD/build/Release" \
                   ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO

    - name: Package
      run: |
        mkdir -p Products
        (cd build/Release && zip -r ../../Products/iGPUTalks-29.41.10-RELEASE.zip iGPUTalks.kext)
        (cd build/Debug && zip -r ../../Products/iGPUTalks-29.41.10-DEBUG.zip iGPUTalks.kext)

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: iGPUTalks-Builds
        path: Products/*.zip
