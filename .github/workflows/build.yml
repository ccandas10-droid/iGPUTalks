name: CI Build Process

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build iGPUTalks Kext
    runs-on: macos-14

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Set Kext Product Versioning
      run: |
        echo "Stamping Version 29.41.10 (26Y29.41)"
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 29.41.10" iGPUTalks/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 29.41.10" iGPUTalks/Info.plist

    - name: Build Debug Configuration
      run: |
        xcodebuild -project iGPUTalks.xcodeproj \
                   -scheme iGPUTalks \
                   -configuration Debug \
                   -derivedDataPath build/Debug \
                   BUILD_DIR=build/Debug/Outputs \
                   ONLY_ACTIVE_ARCH=NO

    - name: Build Release Configuration
      run: |
        xcodebuild -project iGPUTalks.xcodeproj \
                   -scheme iGPUTalks \
                   -configuration Release \
                   -derivedDataPath build/Release \
                   BUILD_DIR=build/Release/Outputs \
                   ONLY_ACTIVE_ARCH=NO

    - name: Package Artifacts
      run: |
        mkdir -p Products
        cd build/Release/Outputs/Release/
        zip -r ../../../../Products/iGPUTalks-29.41.10-RELEASE.zip iGPUTalks.kext
        cd ../../../../build/Debug/Outputs/Debug/
        zip -r ../../../../Products/iGPUTalks-29.41.10-DEBUG.zip iGPUTalks.kext

    - name: Upload Compiled Kext Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iGPUTalks-Builds
        path: Products/*.zip
