name: CI Build Process

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build iGPUTalks Kext
    runs-on: macos-14

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Embed Version and Build Kext Binary
      run: |
        echo "Compiling iGPUTalks using raw clang compiler shortcuts..."
        mkdir -p iGPUTalks.kext/Contents/MacOS
        
        # C++ dosyalarını macOS Kernel altyapısına uygun parametrelerle derliyoruz
        clang++ -Xconnector -stdlib=libc++ -nostdinc++ \
          -fno-builtin -fno-exceptions -fno-rtti -fno-common \
          -mkernel -target x86_64-apple-macos12.0 \
          -I./Lilu.kext/Contents/Headers \
          -isysroot $(xcrun --sdk macosx --show-sdk-path) \
          iGPUTalks/iGPUTalks.cpp -o iGPUTalks.kext/Contents/MacOS/iGPUTalks

        # Info.plist dosyasını kext paketi içine taşıyoruz
        cp iGPUTalks/Info.plist iGPUTalks.kext/Contents/Info.plist
        
        # Sürüm bilgilerini basıyoruz
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 29.41.10" iGPUTalks.kext/Contents/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 29.41.10" iGPUTalks.kext/Contents/Info.plist

    - name: Package Artifacts
      run: |
        mkdir -p Products
        zip -r Products/iGPUTalks-29.41.10-RELEASE.zip iGPUTalks.kext

    - name: Upload Compiled Kext Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iGPUTalks-Builds
        path: Products/*.zip
